# PostgreSQL. Versions 9.3 and up are supported.
#
# Install the pg driver:
#   gem install pg
# On macOS with Homebrew:
#   gem install pg -- --with-pg-config=/usr/local/bin/pg_config
# On Windows:
#   gem install pg
#       Choose the win32 build.
#       Install PostgreSQL and put its /bin directory on your path.
#
# Configure Using Gemfile
# gem "pg"
#
default: &default
  adapter: postgresql
  encoding: unicode
  # Threads Puma + threads Solid Queue quand il tourne dans Puma (SOLID_QUEUE_IN_PUMA).
  pool: <%= ENV.fetch("DB_POOL") { ENV.fetch("RAILS_MAX_THREADS", 3).to_i + 7 } %>

development:
  <<: *default
  database: as_monaco_beach_volley_app_development

test:
  <<: *default
  # `url` explicite : sans lui, un DATABASE_URL présent dans l'environnement
  # (celui du .env de développement, par exemple) prend le pas sur `database`
  # et la suite de tests s'exécute sur la base de développement.
  url: <%= ENV.fetch("TEST_DATABASE_URL", "postgresql://localhost/as_monaco_beach_volley_app_test") %>

production:
  <<: *default
  url: <%= ENV['DATABASE_URL'] %>
