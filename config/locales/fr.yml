fr:
  time:
    formats:
      long: "%A %d %B %Y à %H:%M"
      day_month: "%d/%m"
      time: "%H:%M"
      day_month_year: "%d/%m/%Y"
      short: "%d/%m" 
      default: "%d/%m/%Y %H:%M"
      month_and_year: "%B %Y"
  date:
    formats:
      default: "%d/%m/%Y"
      long: "%d %B %Y"
      month_and_year: "%B %Y"
      # Séparateurs de jour de la grille et en-tête des cartes de session.
      day_and_month: "%A %-d %B"
    month_names: [~, janvier, février, mars, avril, mai, juin, juillet, août, septembre, octobre, novembre, décembre]
    abbr_month_names: [~, jan, fév, mar, avr, mai, juin, juil, août, sep, oct, nov, déc]
    day_names: [dimanche, lundi, mardi, mercredi, jeudi, vendredi, samedi]
    abbr_day_names: [dim, lun, mar, mer, jeu, ven, sam]


  # Formats numériques français. Sans cette section, Rails retombait sur les
  # défauts anglais (« 45.00 € ») et chaque vue devait passer separator: ","
  # à la main — ce que faisait le dashboard admin.
  number:
    format:
      separator: ","
      delimiter: " "
      precision: 2
      significant: false
      strip_insignificant_zeros: false
    currency:
      format:
        format: "%n %u"
        unit: "€"
        separator: ","
        delimiter: " "
        precision: 2
    percentage:
      format:
        format: "%n %"
        separator: ","
        delimiter: " "
  errors:
    messages:
      not_saved:
        one: "1 erreur a empêché l'enregistrement de ce(tte) %{resource} :"
        other: "%{count} erreurs ont empêché l'enregistrement de ce(tte) %{resource} :"

  activerecord:
    errors:
      messages:
        record_invalid: "Validation échouée: %{errors}"
